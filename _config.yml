# ============================================================
#  Chenile marketing + documentation site
#  GitHub Pages ready. Build locally with:  bundle exec jekyll serve
# ============================================================

title: "Chenile — Microservices done right"
tagline: "Separate what a service does from how it is governed."
description: >-
  Chenile is an open-source Java framework that cleanly separates service
  definition from service implementation, and lets you apply service policies
  consistently at the API gateway and the last mile.
author: "The Kollurus"
email: raja@thekollurus.com

# When deployed to GitHub Pages at https://<user>.github.io/chenile-site
# set baseurl to "/chenile-site". For a user/org root or custom domain, leave "".
url: ""
baseurl: ""

github_repo: "https://github.com/rajakolluru"
docs_url: "https://cheniledocs.github.io"
maven_version: "2.1.29"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

collections:
  concepts:
    output: true
    permalink: /concepts/:name/
  episodes:
    output: true
    permalink: /video-series/:name/

defaults:
  - scope: { path: "", type: "concepts" }
    values: { layout: "concept" }
  - scope: { path: "", type: "episodes" }
    values: { layout: "episode" }
  - scope: { path: "" }
    values: { layout: "page" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .idea

plugins:
  - jekyll-feed
