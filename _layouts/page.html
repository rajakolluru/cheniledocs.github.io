---
layout: default
---
<div class="page-hero">
  <div class="narrow">
    {% if page.kicker %}<div class="kicker">{{ page.kicker }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </div>
</div>
<article class="doc">
  <div class="narrow">
    {{ content }}
  </div>
</article>
