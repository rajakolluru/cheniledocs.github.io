<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Chenile proxy framework: a client calls a service through its interface; a client-side interceptor chain runs, then the call is routed locally in-VM or remotely over HTTP or events, using the service registry.">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0801e"/><stop offset="0.5" stop-color="#f89038"/><stop offset="1" stop-color="#ffab52"/>
    </linearGradient>
    <marker id="pa" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f89038"/></marker>
    <marker id="pal" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b3a99a"/></marker>
    <filter id="psh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d0d0d" flood-opacity="0.16"/></filter>
    <style>.h{font-weight:800;fill:#141414}.wh{fill:#fff}.mut{fill:#857f76}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.chip{font-weight:600;font-size:12px}</style>
  </defs>

  <text x="530" y="38" text-anchor="middle" font-size="24" class="h">Call a service through its <tspan fill="#e0801e">interface</tspan> — with client-side interception</text>
  <text x="530" y="64" text-anchor="middle" font-size="14" class="mut">The proxy implements the target interface. You write <tspan class="mono" font-size="12">bService.op(payload)</tspan> — Chenile handles interceptors, routing and transport.</text>

  <!-- caller -->
  <g filter="url(#psh)"><rect x="30" y="150" width="150" height="150" rx="16" fill="#fff" stroke="#ece6dd"/></g>
  <text x="105" y="182" text-anchor="middle" font-size="24">🧩</text>
  <text x="105" y="208" text-anchor="middle" class="h" font-size="14">AService</text>
  <text x="105" y="230" text-anchor="middle" class="mut" font-size="11.5">holds a</text>
  <rect x="46" y="240" width="118" height="26" rx="7" fill="#fff1e2" stroke="#ffd9b3"/><text x="105" y="257" text-anchor="middle" class="mono" fill="#c8611a" font-size="11">BService ref</text>
  <text x="105" y="285" text-anchor="middle" class="mut" font-size="10.5">(a generated proxy)</text>

  <line x1="180" y1="225" x2="214" y2="225" stroke="#f89038" stroke-width="2.5" marker-end="url(#pa)"/>

  <!-- proxy + client interceptor chain -->
  <g filter="url(#psh)"><rect x="220" y="112" width="360" height="264" rx="18" fill="#0d0d0d"/></g>
  <rect x="220" y="112" width="360" height="32" rx="18" fill="url(#pg)"/><rect x="220" y="128" width="360" height="16" fill="#161616"/>
  <text x="238" y="133" font-size="12.5" class="wh" font-weight="700">🔌 BServiceProxy · implements BService</text>
  <text x="238" y="164" class="mono" font-size="11" fill="#d8cfc0">ProxyBuilder.buildProxy(BService.class, …)</text>
  <text x="238" y="188" class="mono" font-size="11" fill="#857f76">client-side interceptor chain (client processors)</text>
  <g>
    <rect x="238" y="198" width="150" height="28" rx="7" fill="#2a2a2a"/><text x="313" y="216" text-anchor="middle" class="chip wh">Copy / propagate headers</text>
    <rect x="398" y="198" width="164" height="28" rx="7" fill="#2a2a2a"/><text x="480" y="216" text-anchor="middle" class="chip wh">Auth token · correlation</text>
    <rect x="238" y="232" width="120" height="28" rx="7" fill="#2a2a2a"/><text x="298" y="250" text-anchor="middle" class="chip wh">Logging</text>
    <rect x="368" y="232" width="120" height="28" rx="7" fill="#2a2a2a"/><text x="428" y="250" text-anchor="middle" class="chip wh">Retry / timeout</text>
    <rect x="498" y="232" width="64" height="28" rx="7" fill="#2a2a2a"/><text x="530" y="250" text-anchor="middle" class="chip wh">…</text>
    <rect x="238" y="266" width="324" height="28" rx="7" fill="#241c10"/><text x="400" y="284" text-anchor="middle" class="chip" fill="#ffd9ad">Response handler · body-type selector</text>
  </g>
  <text x="238" y="316" class="mut" font-size="10.5" fill="#a89f92">configurable per service and per operation</text>
  <!-- router -->
  <rect x="238" y="326" width="324" height="36" rx="9" fill="#1a1a1a"/>
  <text x="400" y="349" text-anchor="middle" class="mono wh" font-size="11.5">ProxyTypeRouter — local or remote?</text>

  <!-- registry (feeds the proxy) -->
  <g filter="url(#psh)"><rect x="238" y="392" width="324" height="30" rx="9" fill="#faf7f2" stroke="#ece6dd"/></g>
  <text x="400" y="412" text-anchor="middle" class="mono" font-size="11" fill="#c8611a">service registry → remote service &amp; operation definitions</text>
  <line x1="400" y1="392" x2="400" y2="368" stroke="#b3a99a" stroke-width="1.8" marker-end="url(#pal)"/>

  <!-- routing outcomes -->
  <path d="M580,200 L636,200" stroke="#f89038" stroke-width="2.5" marker-end="url(#pa)"/>
  <path d="M580,300 L636,300" stroke="#f89038" stroke-width="2.5" marker-end="url(#pa)"/>

  <!-- LOCAL -->
  <g filter="url(#psh)"><rect x="642" y="150" width="392" height="94" rx="14" fill="#fff" stroke="#ece6dd"/></g>
  <rect x="642" y="150" width="392" height="28" rx="14" fill="#fff1e2"/><rect x="642" y="164" width="392" height="14" fill="#fff1e2"/>
  <text x="662" y="169" class="h" font-size="13">⚡ LOCAL · same JVM</text>
  <text x="662" y="200" class="mut" font-size="12">Synchronous in-process call — a modulith.</text>
  <text x="662" y="222" class="mono" font-size="11" fill="#c8611a">LocalProxyInvoker</text>

  <!-- REMOTE -->
  <g filter="url(#psh)"><rect x="642" y="256" width="392" height="128" rx="14" fill="#fff" stroke="#ece6dd"/></g>
  <rect x="642" y="256" width="392" height="28" rx="14" fill="#ffe6cc"/><rect x="642" y="270" width="392" height="14" fill="#ffe6cc"/>
  <text x="662" y="275" class="h" font-size="13">🌐 REMOTE · another service</text>
  <rect x="662" y="296" width="150" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="737" y="316" text-anchor="middle" class="chip" fill="#c8611a">HTTP · HttpInvoker</text>
  <rect x="822" y="296" width="196" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="920" y="316" text-anchor="middle" class="chip" fill="#c8611a">event · ChenilePubSub (observer)</text>
  <text x="662" y="352" class="mut" font-size="11.5">RemoteProxyInvoker → the target service's</text>
  <text x="662" y="370" class="mut" font-size="11.5">own <tspan class="h" font-size="11.5">server-side</tspan> interception pipeline.</text>

  <!-- bottom note -->
  <rect x="30" y="440" width="1004" height="46" rx="12" fill="#0d0d0d"/>
  <text x="530" y="462" text-anchor="middle" font-size="13.5" fill="#fff" font-weight="700">Same interception idea as the server — now on the client. Add a proxy by declaring the interface; policies attach by configuration.</text>
  <text x="530" y="480" text-anchor="middle" font-size="11.5" fill="#ffd9ad" class="mono">chenile-proxies · chenile-service-registry</text>

  <!-- legend -->
  <text x="30" y="520" font-size="11.5" class="mut">Local vs remote is decided dynamically (ProxyMode.COMPUTE_DYNAMICALLY) — the caller code is identical either way.</text>
</svg>
