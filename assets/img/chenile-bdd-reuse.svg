<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One Gherkin feature file reused across MockMvc unit tests and REST Assured integration tests.">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0801e"/><stop offset="0.5" stop-color="#f89038"/><stop offset="1" stop-color="#ffab52"/>
    </linearGradient>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f89038"/></marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d0d0d" flood-opacity="0.16"/></filter>
    <style>.h{font-weight:800;fill:#141414}.wh{fill:#fff}.mut{fill:#857f76}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.chip{font-weight:600;font-size:13px}</style>
  </defs>

  <text x="530" y="40" text-anchor="middle" font-size="24" class="h">Write the behaviour once. Run it two ways.</text>
  <text x="530" y="66" text-anchor="middle" font-size="14" class="mut">The same Gherkin vocabulary is implemented by two step libraries — so one <tspan class="mono" font-size="12">.feature</tspan> file is both a unit test and an integration test.</text>

  <!-- feature file -->
  <g filter="url(#sh2)"><rect x="360" y="96" width="340" height="150" rx="16" fill="#0d0d0d"/></g>
  <rect x="360" y="96" width="340" height="30" rx="16" fill="url(#g2)"/>
  <rect x="360" y="112" width="340" height="14" fill="#161616"/>
  <text x="378" y="116" font-size="12" class="wh mono">service.feature  ·  Gherkin</text>
  <text x="378" y="150" font-size="12.5" class="mono" fill="#ffd9ad">Scenario: op1 sets the id</text>
  <text x="378" y="172" font-size="12.5" class="mono" fill="#efe6d8">  When I POST a REST request to</text>
  <text x="378" y="190" font-size="12.5" class="mono" fill="#efe6d8">       URL "/s1/op1" with payload …</text>
  <text x="378" y="212" font-size="12.5" class="mono" fill="#efe6d8">  Then the REST response key "id"</text>
  <text x="378" y="230" font-size="12.5" class="mono" fill="#efe6d8">       is "S1ServiceImpl"</text>

  <!-- branch arrows -->
  <path d="M470,246 C470,300 250,300 250,336" fill="none" stroke="#f89038" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M590,246 C590,300 810,300 810,336" fill="none" stroke="#f89038" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="330" y="300" text-anchor="middle" font-size="12" class="mut">same steps →</text>
  <text x="730" y="300" text-anchor="middle" font-size="12" class="mut">← same steps</text>

  <!-- LEFT: unit / mockmvc -->
  <g filter="url(#sh2)"><rect x="60" y="340" width="380" height="176" rx="16" fill="#fff" stroke="#ece6dd"/></g>
  <rect x="60" y="340" width="380" height="30" rx="16" fill="#fff1e2"/><rect x="60" y="356" width="380" height="14" fill="#fff1e2"/>
  <text x="80" y="360" font-size="13" class="h">🧪 Unit / component test</text>
  <text x="80" y="392" font-size="12.5" class="mono" fill="#c8611a">cucumber-utils · chenile-core</text>
  <rect x="80" y="404" width="150" height="28" rx="8" fill="#fff1e2"/><text x="155" y="423" text-anchor="middle" class="chip" fill="#c8611a">Spring MockMvc</text>
  <rect x="238" y="404" width="170" height="28" rx="8" fill="#fff1e2"/><text x="323" y="423" text-anchor="middle" class="chip" fill="#c8611a">RestCukesSteps</text>
  <text x="80" y="454" font-size="12.5" class="mut">In-process, ephemeral instance — no network.</text>
  <text x="80" y="474" font-size="12.5" class="mut">Exercises the service <tspan class="h" font-size="12.5">and its interceptors</tspan>.</text>
  <text x="80" y="497" font-size="12.5" class="mut">Fast · runs on every build.</text>

  <!-- RIGHT: integration / rest assured -->
  <g filter="url(#sh2)"><rect x="620" y="340" width="380" height="176" rx="16" fill="#fff" stroke="#ece6dd"/></g>
  <rect x="620" y="340" width="380" height="30" rx="16" fill="#ffe6cc"/><rect x="620" y="356" width="380" height="14" fill="#ffe6cc"/>
  <text x="640" y="360" font-size="13" class="h">🌐 Integration test</text>
  <text x="640" y="392" font-size="12.5" class="mono" fill="#e0801e">it-cucumber-utils · chenile-bdd</text>
  <rect x="640" y="404" width="140" height="28" rx="8" fill="#ffe6cc"/><text x="710" y="423" text-anchor="middle" class="chip" fill="#e0801e">REST Assured</text>
  <rect x="788" y="404" width="180" height="28" rx="8" fill="#ffe6cc"/><text x="878" y="423" text-anchor="middle" class="chip" fill="#e0801e">RestCukesSteps</text>
  <text x="640" y="454" font-size="12.5" class="mut">Hits a <tspan class="h" font-size="12.5">really deployed</tspan> server over HTTP.</text>
  <text x="640" y="474" font-size="12.5" class="mut">Verifies the wire, config &amp; environment.</text>
  <text x="640" y="497" font-size="12.5" class="mut">Same scenarios · run against staging.</text>

  <!-- center note -->
  <rect x="455" y="470" width="150" height="40" rx="10" fill="#0d0d0d"/>
  <text x="530" y="488" text-anchor="middle" font-size="12.5" class="wh h" fill="#fff">swap the glue,</text>
  <text x="530" y="504" text-anchor="middle" font-size="12.5" class="wh" fill="#fff">not the spec</text>
</svg>
