<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" font-family="Josefin Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Chenile runtime: one policy model running at the API gateway and the last mile.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0801e"/><stop offset="0.5" stop-color="#f89038"/><stop offset="1" stop-color="#ffab52"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f1f"/><stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f89038"/>
    </marker>
    <marker id="arrowl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b3a99a"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d0d0d" flood-opacity="0.18"/>
    </filter>
    <style>
      .h{font-family:'Sora','Josefin Sans',sans-serif;font-weight:800;fill:#141414}.wh{fill:#fff}.mut{fill:#857f76}.lbl{font-weight:700}
      .chip{font-weight:600;font-size:13px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    </style>
  </defs>

  <!-- title -->
  <text x="530" y="40" text-anchor="middle" font-size="24" class="h">One policy model — the gateway <tspan fill="#e0801e">and</tspan> the last mile</text>
  <text x="530" y="66" text-anchor="middle" font-size="14" class="mut">The same interceptor contract runs at the edge and inside every service. Placement is configuration.</text>

  <!-- client -->
  <g filter="url(#sh)">
    <rect x="24" y="150" width="120" height="86" rx="14" fill="#fff" stroke="#ece6dd"/>
  </g>
  <text x="84" y="188" text-anchor="middle" font-size="26">🌐</text>
  <text x="84" y="214" text-anchor="middle" font-size="14" class="lbl h">Client</text>

  <!-- arrow client -> gateway -->
  <line x1="150" y1="193" x2="204" y2="193" stroke="#f89038" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- API GATEWAY -->
  <g filter="url(#sh)">
    <rect x="210" y="110" width="330" height="172" rx="18" fill="url(#ink)"/>
  </g>
  <rect x="210" y="110" width="330" height="34" rx="18" fill="url(#g)"/>
  <rect x="210" y="128" width="330" height="16" fill="#161616"/>
  <text x="228" y="133" font-size="13" class="wh lbl">🛡️ API GATEWAY · the edge</text>
  <text x="228" y="164" font-size="12" class="mono" fill="#d8cfc0">chenile-security · auth gateway</text>
  <!-- gateway policy chips -->
  <g>
    <rect x="228" y="178" width="130" height="30" rx="8" fill="#2a2a2a"/><text x="293" y="198" text-anchor="middle" class="chip wh">Authenticate</text>
    <rect x="368" y="178" width="150" height="30" rx="8" fill="#2a2a2a"/><text x="443" y="198" text-anchor="middle" class="chip wh">Rate&#8209;limit / quota</text>
    <rect x="228" y="216" width="150" height="30" rx="8" fill="#2a2a2a"/><text x="303" y="236" text-anchor="middle" class="chip wh">Coarse authz</text>
    <rect x="388" y="216" width="130" height="30" rx="8" fill="#2a2a2a"/><text x="453" y="236" text-anchor="middle" class="chip wh">Normalize</text>
  </g>
  <text x="228" y="266" font-size="11.5" fill="#a89f92">Leverage: one config guards everything behind it</text>

  <!-- arrow gateway -> service (authenticated) -->
  <line x1="540" y1="193" x2="596" y2="193" stroke="#f89038" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="568" y="182" text-anchor="middle" font-size="10.5" class="mut">trusted</text>

  <!-- SERVICE / LAST MILE -->
  <g filter="url(#sh)">
    <rect x="602" y="96" width="434" height="288" rx="18" fill="#fff" stroke="#ece6dd"/>
  </g>
  <rect x="602" y="96" width="434" height="34" rx="18" fill="url(#g)"/>
  <rect x="602" y="114" width="434" height="16" fill="#e0801e"/>
  <text x="620" y="119" font-size="13" class="wh lbl">🎯 SERVICE · the last mile</text>

  <!-- exchange -->
  <rect x="624" y="150" width="180" height="34" rx="9" fill="#fff1e2" stroke="#ffd9b3"/>
  <text x="714" y="172" text-anchor="middle" font-size="13" class="lbl h">ChenileExchange</text>
  <line x1="804" y1="167" x2="836" y2="167" stroke="#b3a99a" stroke-width="2" marker-end="url(#arrowl)"/>

  <!-- interception pipeline -->
  <text x="624" y="210" font-size="12" class="mono mut">interception pipeline — your service policies</text>
  <g>
    <rect x="624" y="220" width="185" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="716" y="240" text-anchor="middle" class="chip" fill="#c8611a">Authorize this resource</text>
    <rect x="819" y="220" width="195" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="916" y="240" text-anchor="middle" class="chip" fill="#c8611a">Multi&#8209;tenancy</text>
    <rect x="624" y="256" width="120" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="684" y="276" text-anchor="middle" class="chip" fill="#c8611a">i18n</text>
    <rect x="754" y="256" width="120" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="814" y="276" text-anchor="middle" class="chip" fill="#c8611a">Idempotency</text>
    <rect x="884" y="256" width="130" height="30" rx="8" fill="#fff1e2" stroke="#ffd9b3"/><text x="949" y="276" text-anchor="middle" class="chip" fill="#c8611a">Audit / logging</text>
  </g>
  <!-- arrow pipeline -> impl -->
  <line x1="820" y1="300" x2="820" y2="322" stroke="#f89038" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- impl -->
  <rect x="624" y="326" width="390" height="44" rx="10" fill="url(#g)"/>
  <text x="819" y="354" text-anchor="middle" font-size="15" class="wh lbl">Service implementation — pure business logic</text>

  <!-- shared contract note -->
  <rect x="210" y="418" width="826" height="52" rx="12" fill="#faf7f2" stroke="#ece6dd"/>
  <text x="623" y="443" text-anchor="middle" font-size="14" class="h">Same interceptor contract in both boxes</text>
  <text x="623" y="461" text-anchor="middle" font-size="12.5" class="mut">The service registry decides whether a policy runs at the gateway, the last mile, or both — a config change, not a rewrite.</text>

  <!-- layer ribbon -->
  <text x="24" y="510" font-size="12" class="mono mut">LAYERS</text>
  <g font-size="12" class="mono">
    <rect x="24" y="520" width="150" height="40" rx="9" fill="#0d0d0d"/><text x="99" y="545" text-anchor="middle" class="wh">chenile-parent</text>
    <rect x="182" y="520" width="140" height="40" rx="9" fill="#241c10"/><text x="252" y="545" text-anchor="middle" class="wh">chenile-core</text>
    <rect x="330" y="520" width="200" height="40" rx="9" fill="#3a2a10"/><text x="430" y="545" text-anchor="middle" class="wh">query · workflow · process</text>
    <rect x="538" y="520" width="330" height="40" rx="9" fill="#e0801e"/><text x="703" y="545" text-anchor="middle" class="wh">registry · proxies · security · messaging</text>
    <rect x="876" y="520" width="160" height="40" rx="9" fill="#c8611a"/><text x="956" y="545" text-anchor="middle" class="wh">bdd · others · cconfig</text>
  </g>
</svg>
