<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" font-family="Josefin Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Chenile messaging: one ChenilePub/ChenileSub interface with MQTT, Kafka, Azure and in-JVM implementations, feeding the same interception pipeline.">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0801e"/><stop offset="0.5" stop-color="#f89038"/><stop offset="1" stop-color="#ffab52"/>
    </linearGradient>
    <marker id="ma" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f89038"/></marker>
    <filter id="msh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d0d0d" flood-opacity="0.16"/></filter>
    <style>.h{font-family:'Sora','Josefin Sans',sans-serif;font-weight:800;fill:#141414}.wh{fill:#fff}.mut{fill:#857f76}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.chip{font-weight:600;font-size:12.5px}</style>
  </defs>

  <text x="530" y="40" text-anchor="middle" font-size="24" class="h">One messaging interface. Many transports.</text>
  <text x="530" y="66" text-anchor="middle" font-size="14" class="mut">Services depend on the <tspan class="mono" font-size="12">chenile-pub-sub</tspan> interface — never on a broker. The transport is a swappable implementation.</text>

  <!-- INTERFACE bar -->
  <g filter="url(#msh)"><rect x="300" y="96" width="460" height="96" rx="16" fill="#0d0d0d"/></g>
  <rect x="300" y="96" width="460" height="32" rx="16" fill="url(#mg)"/><rect x="300" y="112" width="460" height="16" fill="#161616"/>
  <text x="320" y="117" font-size="13" class="wh" font-weight="700">🧵 THE INTERFACE · chenile-pub-sub</text>
  <text x="320" y="152" font-size="13" class="mono" fill="#ffd9ad">interface ChenilePub</text>
  <text x="320" y="172" font-size="11.5" class="mono" fill="#efe6d8">publish() · asyncPublish() · publishToOperation()</text>
  <text x="600" y="152" font-size="13" class="mono" fill="#ffd9ad">interface ChenileSub</text>
  <text x="600" y="172" font-size="11.5" class="mono" fill="#efe6d8">messageArrived()</text>

  <!-- fan-out arrows to implementations -->
  <path d="M400,192 C400,224 150,224 150,250" fill="none" stroke="#f89038" stroke-width="2.2" marker-end="url(#ma)"/>
  <path d="M470,192 C470,224 400,224 400,250" fill="none" stroke="#f89038" stroke-width="2.2" marker-end="url(#ma)"/>
  <path d="M590,192 C590,224 660,224 660,250" fill="none" stroke="#f89038" stroke-width="2.2" marker-end="url(#ma)"/>
  <path d="M660,192 C660,224 910,224 910,250" fill="none" stroke="#f89038" stroke-width="2.2" marker-end="url(#ma)"/>
  <text x="530" y="238" text-anchor="middle" font-size="11.5" class="mut">implemented by ↓</text>

  <!-- IMPLEMENTATIONS -->
  <g font-size="12.5">
    <g filter="url(#msh)"><rect x="40" y="252" width="220" height="86" rx="14" fill="#fff" stroke="#ece6dd"/></g>
    <text x="60" y="282" class="h" font-size="14">📡 MQTT</text>
    <text x="60" y="304" class="mono" fill="#c8611a" font-size="11.5">chenile-mqtt</text>
    <text x="60" y="324" class="mut" font-size="11.5">MqttPublisher · MqttSubscriber</text>

    <g filter="url(#msh)"><rect x="290" y="252" width="220" height="86" rx="14" fill="#fff" stroke="#ece6dd"/></g>
    <text x="310" y="282" class="h" font-size="14">🟧 Kafka</text>
    <text x="310" y="304" class="mono" fill="#c8611a" font-size="11.5">chenile-kafka</text>
    <text x="310" y="324" class="mut" font-size="11.5">KafkaPublisher</text>

    <g filter="url(#msh)"><rect x="550" y="252" width="220" height="86" rx="14" fill="#fff" stroke="#ece6dd"/></g>
    <text x="570" y="282" class="h" font-size="14">☁️ Azure</text>
    <text x="570" y="304" class="mono" fill="#c8611a" font-size="11.5">chenile-azure</text>
    <text x="570" y="324" class="mut" font-size="11.5">AzurePublisher</text>

    <g filter="url(#msh)"><rect x="800" y="252" width="220" height="86" rx="14" fill="#fff" stroke="#ece6dd"/></g>
    <text x="820" y="282" class="h" font-size="14">⚙️ In-JVM</text>
    <text x="820" y="304" class="mono" fill="#c8611a" font-size="11.5">chenile-jvm-pub-sub</text>
    <text x="820" y="324" class="mut" font-size="11.5">JvmPublisher · same code, no broker</text>
  </g>

  <!-- unify into pipeline -->
  <path d="M530,338 L530,372" fill="none" stroke="#b3a99a" stroke-width="2" marker-end="url(#ma)"/>
  <text x="548" y="360" font-size="11.5" class="mut">inbound message →</text>

  <g filter="url(#msh)"><rect x="150" y="378" width="760" height="150" rx="16" fill="#faf7f2" stroke="#ece6dd"/></g>
  <text x="530" y="406" text-anchor="middle" font-size="14" class="h">Every message enters the same runtime as an HTTP call</text>
  <rect x="180" y="424" width="210" height="34" rx="9" fill="#fff1e2" stroke="#ffd9b3"/><text x="285" y="446" text-anchor="middle" class="chip" fill="#c8611a">ChenileExchange</text>
  <text x="398" y="446" font-size="16" fill="#f89038">→</text>
  <rect x="416" y="424" width="270" height="34" rx="9" fill="#fff1e2" stroke="#ffd9b3"/><text x="551" y="446" text-anchor="middle" class="chip" fill="#c8611a">interception pipeline (policies)</text>
  <text x="694" y="446" font-size="16" fill="#f89038">→</text>
  <rect x="712" y="424" width="176" height="34" rx="9" fill="url(#mg)"/><text x="800" y="446" text-anchor="middle" class="chip wh">service operation</text>
  <text x="530" y="500" text-anchor="middle" font-size="12.5" class="mut">Same interceptors, same security/tenancy/logging policies — whether the trigger was REST, a proxy call, or a message.</text>

  <!-- cloud-edge note -->
  <rect x="150" y="548" width="760" height="34" rx="9" fill="#0d0d0d"/>
  <text x="530" y="570" text-anchor="middle" font-size="12.5" fill="#ffd9ad" class="mono">cloud-edge-switch routes the same messages between edge devices and the cloud broker</text>
</svg>
